# Checked-in fallback for the Secrets Gradle Plugin, used ONLY when
# android/secrets.properties (git-ignored) does not exist locally.
# This lets the project still build without the real Google Maps API key —
# the map will simply not render tiles until a real key is provided.
#
# To use real Maps functionality, create android/secrets.properties with:
#   MAPS_API_KEY=<the real key>
# Never put the real key in this file.
MAPS_API_KEY=DEFAULT_API_KEY_NOT_SET
